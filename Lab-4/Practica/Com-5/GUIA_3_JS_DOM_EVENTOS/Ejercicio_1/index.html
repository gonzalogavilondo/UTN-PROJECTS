<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ejercicio 1 - DOM</title>

    <link rel="stylesheet" href="./CSS/style.css">
</head>

<body>

    <header>
        <h1>Mi página</h1>
    </header>

    <main>

        <section>
            <h2>Sección 1</h2>

            <p>
                Este es el contenido de la primera sección.
            </p>

            <ul>
                <li>Elemento 1</li>
                <li>Elemento 2</li>
                <li>Elemento 3</li>
            </ul>
        </section>

        <section>
            <h2>Sección 2</h2>

            <p>
                Este es el contenido de la segunda sección.
            </p>

            <ul>
                <li>Elemento A</li>
                <li>Elemento B</li>
                <li>Elemento C</li>
            </ul>
        </section>

    </main>

    <footer>
        <p>Pie de página</p>
    </footer>

</body>
</html>

<!--
    Preguntas y Respuestas:

    ¿Qué relación existe entre la estructura HTML y el árbol del DOM?
    La estructura HTML es la base a partir de la cual el navegador construye
    el árbol del DOM. Cada etiqueta HTML se representa como un nodo del árbol.

    ¿Qué elementos son hijos directos de main?
    Los hijos directos de main son las dos secciones: section 1 y section 2.

    ¿Qué función cumplió Flexbox en este ejercicio?
    Flexbox permitió organizar las dos secciones una al lado de la otra,
    centrarlas y mantener una separación de 20px entre ellas.

    ¿El uso de Flexbox modifica el DOM?
    No. Flexbox solo modifica la presentación y la distribución visual de los
    elementos mediante CSS; no modifica la estructura ni el árbol del DOM.
-->
