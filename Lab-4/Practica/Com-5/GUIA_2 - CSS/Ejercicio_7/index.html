<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tarjeta de Perfil</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main>
        <!--
            TARJETA DE PERFIL:
            Agrupa todos los elementos del componente.
        -->
        <article class="profile-card">
            <!--
                IMAGEN DE PERFIL:
                Usamos un placeholder circular para simular la foto del usuario.
            -->
            <img
                class="profile-image"
                src="https://via.placeholder.com/160"
                alt="Foto de perfil del usuario"
            >

            <!--
                NOMBRE (TITULO):
                Es el texto principal de la tarjeta.
            -->
            <h1 class="profile-name">Gonzalo Gavilondo</h1>

            <!--
                DESCRIPCION BREVE:
                Resume el perfil de la persona.
            -->
            <p class="profile-description">
                Desarrollador back-end especializado en soluciones BSS/OSS, con foco en Oracle BRM, 
                y experiencia en desarrollo, integración y pruebas de soluciones TELCO.
            </p>

            <!--
                BOTON DE ACCION:
                El hover se define en CSS para mostrar interaccion.
            -->
            <button class="contact-button" type="button">Contactar</button>
        </article>
    </main>
</body>
</html>
